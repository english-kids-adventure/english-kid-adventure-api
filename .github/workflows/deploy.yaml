name: Deploy Express API

on:
  push:
    branches: [ "feature/VLIST-100-CI/CD" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          chmod 600 .env

      - name: Build Docker Image
        run: docker build -t express-api-image:latest .

      - name: Run Docker Container
        run: |
          docker stop express-api-container || true
          
          docker rm express-api-container || true
          
          docker run -d \
            --name express-api-container \
            -p 8080:8080 \
            --env-file .env \
            --restart always \
            express-api-image:latest

      - name: Cleanup old images
        run: |
          docker image prune -f